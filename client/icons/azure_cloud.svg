<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Azure gradient -->
    <linearGradient id="azureGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#50E6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078D4;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main cloud shape - Azure/Entra style -->
  <g filter="url(#shadow)">
    <!-- Cloud body -->
    <path d="M100 70
             C100 55 88 45 74 45
             C72 35 62 28 50 28
             C36 28 24 38 22 52
             C12 54 4 64 4 76
             C4 90 16 100 32 100
             L92 100
             C106 100 116 88 116 76
             C116 64 106 56 100 70 Z"
          fill="url(#azureGradient)" />

    <!-- Cloud highlight for 3D effect -->
    <ellipse cx="50" cy="55" rx="18" ry="10" fill="rgba(255,255,255,0.3)" />
    <ellipse cx="80" cy="65" rx="12" ry="6" fill="rgba(255,255,255,0.2)" />
  </g>

  <!-- Azure/Entra ID symbol (simplified key/lock concept) -->
  <g transform="translate(44, 58)">
    <!-- Shield shape representing security/identity -->
    <path d="M20 4 L36 10 L36 24 C36 34 28 42 20 46 C12 42 4 34 4 24 L4 10 Z"
          fill="#ffffff" opacity="0.9"/>
    <!-- Inner check mark representing verified identity -->
    <path d="M14 24 L18 28 L28 18"
          stroke="#0078D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
